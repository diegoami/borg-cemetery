name: Check cemetery runner
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-media.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s scripts/native/tests -v
      - run: python3 scripts/death_ids.py --check
      - run: python3 scripts/build_statistics.py --check
